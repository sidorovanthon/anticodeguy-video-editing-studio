<div id="scene-thesis" class="scene clip"
     data-start="1.2" data-duration="10.5" data-track-index="1"
     data-width="1080" data-height="1920">
  <style>
    #scene-thesis {
      position: absolute; inset: 0; opacity: 0; overflow: hidden;
      background: linear-gradient(180deg, #FFF8EC 0%, #E6DFD4 100%);
      font-family: 'Inter', system-ui, sans-serif;
      color: #2a2a2a;
    }
    #scene-thesis .scene-content { position: absolute; inset: 0; }

    #scene-thesis .speaker-plate {
      position: absolute; left: 0; right: 0;
      top: 12%; height: 56%;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(196, 163, 163, 0.45) 0%, rgba(176, 146, 146, 0.28) 38%, rgba(204, 198, 189, 0) 72%),
        linear-gradient(180deg, #E6DFD4 0%, #CCC6BD 100%);
    }

    #scene-thesis .speaker-rim {
      position: absolute; left: 0; right: 0;
      top: 12%; height: 4px;
      background: linear-gradient(90deg, rgba(196, 163, 163, 0) 0%, #C4A3A3 50%, rgba(196, 163, 163, 0) 100%);
      opacity: 0.55;
    }

    #scene-thesis .vignette-top {
      position: absolute; top: 0; left: 0; right: 0; height: 360px;
      background: radial-gradient(ellipse at 50% 0%, #FFFDF8 0%, rgba(255, 253, 248, 0) 75%);
      opacity: 0.6;
      pointer-events: none;
      will-change: opacity;
    }

    #scene-thesis .grain {
      position: absolute; inset: -24px;
      background-image:
        radial-gradient(rgba(42, 42, 42, 0.22) 1px, transparent 1px),
        radial-gradient(rgba(42, 42, 42, 0.14) 1px, transparent 1px);
      background-size: 3px 3px, 5px 5px;
      background-position: 0 0, 1px 2px;
      mix-blend-mode: multiply;
      opacity: 0.05;
      pointer-events: none;
      will-change: transform;
    }

    #scene-thesis .glow {
      position: absolute;
      left: calc(50% - 360px);
      top: calc(60% - 360px);
      width: 720px; height: 720px;
      background: radial-gradient(circle, #F5A623 0%, rgba(245, 166, 35, 0) 60%);
      opacity: 0.10;
      transform-origin: center center;
      will-change: transform, opacity;
      pointer-events: none;
    }

    #scene-thesis .hairline-rule {
      position: absolute; top: 96px; left: 96px; right: 96px; height: 1px;
      background-color: #C4A3A3; opacity: 0.55;
      transform-origin: right center;
      will-change: opacity;
    }

    #scene-thesis .margin-tick {
      position: absolute; bottom: 320px; left: 96px;
      width: 24px; height: 1px;
      background: #C4A3A3; opacity: 0.55;
      transform: scaleX(0); transform-origin: left center;
      will-change: transform;
    }

    #scene-thesis .corner-mark {
      position: absolute; top: 60px; left: 96px;
      font-family: 'Inter', sans-serif;
      font-weight: 500; font-size: 0.75rem;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: #404040; opacity: 0;
      will-change: transform, opacity;
    }

    #scene-thesis .overline {
      position: absolute; top: 60px; right: 96px;
      font-family: 'Inter', sans-serif;
      font-weight: 500; font-size: 0.75rem;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: #404040; opacity: 0;
      will-change: transform, opacity;
    }

    #scene-thesis .overline-rule {
      position: absolute; top: 84px; right: 96px;
      width: 24px; height: 2px;
      background: #F5A623;
      transform: scaleX(0); transform-origin: left center;
      will-change: transform;
    }

    #scene-thesis .headline {
      position: absolute;
      left: 96px; right: 96px; bottom: 360px;
      font-family: 'Playfair Display', serif;
      font-style: italic; font-weight: 400;
      font-size: 4.5rem; line-height: 1.05; letter-spacing: -0.01em;
      color: #2a2a2a;
      max-width: 80%; margin-left: -0.05em;
      font-variant-numeric: oldstyle-nums;
      opacity: 0;
      will-change: transform, opacity;
    }
    #scene-thesis .keyword { position: relative; display: inline-block; }
    #scene-thesis .kw-underline {
      position: absolute; left: 0; right: 0; bottom: 0.04em;
      height: 2px; background-color: #F5A623;
      transform: scaleX(0); transform-origin: left center;
      will-change: transform;
    }

    #scene-thesis .caption-strip {
      position: absolute; left: 96px; right: 96px; bottom: 96px;
      padding: 18px 28px; border-radius: 16px;
      background: rgba(255, 253, 248, 0.82);
      font-family: 'Inter', sans-serif;
      font-weight: 300; font-size: 1.125rem; line-height: 1.7;
      color: #404040; opacity: 0;
      will-change: transform, opacity;
    }

    #scene-thesis .footer-mark {
      position: absolute; left: 96px; bottom: 56px;
      font-family: 'Inter', sans-serif;
      font-weight: 500; font-size: 0.75rem;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: #404040; opacity: 0.45;
    }
  </style>

  <div class="scene-content">
    <div class="speaker-plate"></div>
    <div class="speaker-rim"></div>
    <div class="vignette-top"></div>
    <div class="grain"></div>
    <div class="glow"></div>
    <div class="hairline-rule"></div>
    <div class="margin-tick"></div>
    <div class="corner-mark">soft signal</div>
    <div class="overline">02 / Thesis</div>
    <div class="overline-rule"></div>
    <div class="headline">the <span class="keyword">held<span class="kw-underline" aria-hidden="true"></span></span> breath of the moment.</div>
    <div class="caption-strip">when you stop reaching for the next thing &mdash; that&rsquo;s where the real work begins.</div>
    <div class="footer-mark">take 02 &middot; cream seamless</div>
  </div>

  <script>
    (function () {
      window.__sceneTimelines = window.__sceneTimelines || {};
      const root = document.getElementById('scene-thesis');
      const q = (sel) => root.querySelector(sel);

      const grain    = q('.grain');
      const glow     = q('.glow');
      const hairline = q('.hairline-rule');
      const tick     = q('.margin-tick');
      const overline = q('.overline');
      const corner   = q('.corner-mark');
      const ovrRule  = q('.overline-rule');
      const headline = q('.headline');
      const kwUnder  = q('.kw-underline');
      const caption  = q('.caption-strip');

      const tl = gsap.timeline({ paused: true });
      const sceneDuration = 10.5;

      // Foreground text entrances (every entrance via tl.fromTo).
      tl.fromTo(overline,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.9, ease: 'sine.inOut' }, 0.10);

      tl.fromTo(corner,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 0.55, duration: 0.9, ease: 'sine.inOut' }, 0.14);

      tl.fromTo(tick,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: 'power2.out' }, 0.20);

      tl.fromTo(ovrRule,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, ease: 'power2.out' }, 0.22);

      tl.fromTo(headline,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 1.0, ease: 'sine.inOut' }, 0.32);

      tl.fromTo(caption,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.9, ease: 'power1.inOut' }, 0.55);

      tl.fromTo(kwUnder,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, ease: 'sine.out' }, 1.05);

      // Ambient motion (BG decoratives) — finite repeats only.
      const glowCycle = 1.2;
      tl.to(glow,
        { scale: 1.04, opacity: 0.14, yoyo: true,
          duration: glowCycle, ease: 'sine.inOut',
          repeat: Math.floor(sceneDuration / glowCycle) },
        0);

      const grainCycle = 5.2;
      tl.to(grain,
        { x: 4, y: -3, yoyo: true,
          duration: grainCycle, ease: 'sine.inOut',
          repeat: Math.floor(sceneDuration / grainCycle) },
        0);

      const hairlineCycle = 4.0;
      tl.to(hairline,
        { opacity: 0.35, yoyo: true,
          duration: hairlineCycle, ease: 'sine.inOut',
          repeat: Math.floor(sceneDuration / hairlineCycle) },
        0.7);

      window.__sceneTimelines["thesis"] = tl;
    })();
  </script>
</div>
