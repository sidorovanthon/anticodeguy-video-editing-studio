<div id="scene-thesis" class="scene clip"
     data-start="1.34" data-duration="12.26" data-track-index="1"
     data-width="1080" data-height="1920">
  <style>
    #scene-thesis {
      position: absolute;
      inset: 0;
      opacity: 0;
    }

    #scene-thesis .scene-bg {
      position: absolute;
      inset: 0;
      background: #1a1614;
    }

    #scene-thesis .warm-grain {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(180, 160, 140, 0.08), transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(180, 160, 140, 0.08), transparent 50%);
      mix-blend-mode: overlay;
    }

    #scene-thesis .soft-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(26, 22, 20, 0.12) 100%);
    }

    #scene-thesis .beat-marker {
      position: absolute;
      top: 96px;
      left: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: Inter, sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    #scene-thesis .beat-marker-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e8a14a;
      flex-shrink: 0;
    }

    #scene-thesis .beat-marker-label {
      color: #8a7e72;
    }

    #scene-thesis .hairline-rule {
      position: absolute;
      bottom: 131px;
      left: 64px;
      width: 240px;
      height: 1px;
      background: #e8a14a;
      opacity: 0.6;
    }

    #scene-thesis .caption-plate {
      position: absolute;
      bottom: 96px;
      left: 64px;
      right: 64px;
      padding: 28px;
      background: rgba(36, 31, 27, 0.78);
      border-radius: 14px;
    }

    #scene-thesis .caption-text {
      font-family: Inter, sans-serif;
      font-size: 1.5rem;
      font-weight: 400;
      line-height: 1.45;
      color: #f4ebdc;
      max-width: 78%;
      margin: 0;
      display: none;
    }

    #scene-thesis #ai-agents {
      color: inherit;
    }
  </style>

  <div class="scene-content">
    <div class="scene-bg"></div>
    <div class="warm-grain"></div>
    <div class="soft-vignette"></div>

    <div class="beat-marker">
      <div class="beat-marker-dot"></div>
      <span class="beat-marker-label">THESIS &middot; 2 / 3</span>
    </div>

    <div class="hairline-rule"></div>

    <div class="caption-plate">
      <p class="caption-text" id="caption-group-1">i'm increasingly using</p>
      <p class="caption-text" id="caption-group-2">free open-source tools</p>
      <p class="caption-text" id="caption-group-3">because i can deploy them for myself easily</p>
      <p class="caption-text" id="caption-group-4">with the help of <span id="ai-agents">AI agents</span> &mdash; or just write the software I need</p>
    </div>
  </div>

  <script>
    (function() {
      window.__sceneTimelines = window.__sceneTimelines || {};
      const tl = gsap.timeline({ paused: true });

      const g1Start = 0.52;
      const g1Duration = 1.24;
      const g2Start = 1.76;
      const g2Duration = 1.98;
      const g3Start = 3.74;
      const g3Duration = 2.12;
      const g4Start = 5.86;

      // BG ambient motion (3 decoratives)
      tl.to(".warm-grain", {
        x: -2,
        y: -1,
        duration: 6,
        ease: "sine.inOut"
      }, 0);

      tl.to(".soft-vignette", {
        scale: 1.04,
        transformOrigin: "center center",
        duration: 7,
        ease: "sine.inOut"
      }, 0);

      tl.to(".hairline-rule", {
        opacity: 0.85,
        duration: 2.5,
        ease: "sine.inOut",
        yoyo: true,
        repeat: 1
      }, 0);

      // Caption 1 — entrance only, hard-cut exit (no overlapping opacity tween)
      tl.set("#caption-group-1", { display: "block" }, g1Start);
      tl.fromTo("#caption-group-1",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power1.out", immediateRender: false },
        g1Start);
      tl.set("#caption-group-1", { display: "none" }, g1Start + g1Duration);

      // Caption 2
      tl.set("#caption-group-2", { display: "block" }, g2Start);
      tl.fromTo("#caption-group-2",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false },
        g2Start);
      tl.set("#caption-group-2", { display: "none" }, g2Start + g2Duration);

      // Caption 3
      tl.set("#caption-group-3", { display: "block" }, g3Start);
      tl.fromTo("#caption-group-3",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power1.out", immediateRender: false },
        g3Start);
      tl.set("#caption-group-3", { display: "none" }, g3Start + g3Duration);

      // Caption 4 — final, no exit; held to scene end
      tl.set("#caption-group-4", { display: "block" }, g4Start);
      tl.fromTo("#caption-group-4",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", immediateRender: false },
        g4Start);

      // Highlight on AI agents
      tl.to("#ai-agents", {
        color: "#e8a14a",
        duration: 0.4,
        ease: "power3.out"
      }, g4Start + 0.2);

      window.__sceneTimelines["thesis"] = tl;
    })();
  </script>
</div>
