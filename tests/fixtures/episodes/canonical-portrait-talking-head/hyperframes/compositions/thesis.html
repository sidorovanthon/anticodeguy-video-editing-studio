<div id="scene-thesis" class="scene clip"
     data-start="4.0" data-duration="11.5" data-track-index="1"
     data-width="1080" data-height="1920">
  <style>
    #scene-thesis {
      position: absolute;
      inset: 0;
      opacity: 0;
      background: #1a1614;
      overflow: hidden;
      font-family: "Inter", sans-serif;
      color: #f4ebdc;
    }

    #scene-thesis .bg-grain {
      position: absolute; inset: 0; pointer-events: none;
      background-image:
        radial-gradient(rgba(36,31,27,0.55) 1px, transparent 1px),
        radial-gradient(rgba(36,31,27,0.35) 1px, transparent 1px);
      background-size: 3px 3px, 7px 7px;
      background-position: 0 0, 1px 2px;
      mix-blend-mode: multiply;
      opacity: 0.10;
    }

    #scene-thesis .bg-vignette {
      position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse at 50% 48%,
        rgba(26,22,20,0) 38%,
        rgba(26,22,20,0.45) 88%,
        rgba(26,22,20,0.78) 100%);
      transform-origin: 50% 50%;
    }

    #scene-thesis .bg-halo {
      position: absolute; left: -120px; top: 380px;
      width: 720px; height: 720px; pointer-events: none;
      background: radial-gradient(circle at 50% 50%,
        rgba(232,161,74,0.18) 0%,
        rgba(232,161,74,0.10) 32%,
        rgba(192,140,135,0.06) 60%,
        rgba(232,161,74,0) 78%);
      filter: blur(8px);
      opacity: 0.10;
    }

    #scene-thesis .bg-hairline-tick {
      position: absolute; top: 80px; right: 64px;
      width: 96px; height: 1px;
      background: #e8a14a;
      opacity: 0.30;
      transform-origin: right center;
    }

    #scene-thesis .bg-ghost-type {
      position: absolute; right: -140px; bottom: 120px;
      font-family: "Playfair Display", serif;
      font-style: italic; font-weight: 400;
      font-size: 480px; line-height: 0.9;
      color: #f4ebdc;
      opacity: 0;
      letter-spacing: -0.02em;
      pointer-events: none;
      white-space: nowrap;
    }

    #scene-thesis .beat-marker {
      position: absolute; top: 56px; left: 64px;
      display: flex; align-items: center; gap: 12px;
      opacity: 0;
    }
    #scene-thesis .beat-marker .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #e8a14a;
    }
    #scene-thesis .beat-marker .label {
      font-family: "Inter", sans-serif;
      font-size: 0.75rem; font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8a7e72;
    }

    #scene-thesis .caption-plate {
      position: absolute;
      left: 64px; right: 64px;
      bottom: 96px;
      padding: 28px 64px;
      background: rgba(36,31,27,0.78);
      border-radius: 14px;
      opacity: 0;
      min-height: 140px;
    }
    #scene-thesis .caption-text {
      position: absolute; left: 64px; right: 64px; top: 28px;
      max-width: 78%;
      font-family: "Inter", sans-serif;
      font-size: 1.5rem; font-weight: 400;
      line-height: 1.45;
      color: #f4ebdc;
      opacity: 0;
      margin: 0;
    }
  </style>

  <div class="scene-content">
    <div class="bg-grain"></div>
    <div class="bg-vignette"></div>
    <div class="bg-halo"></div>
    <div class="bg-hairline-tick"></div>
    <div class="bg-ghost-type">signal</div>

    <div class="beat-marker">
      <span class="dot"></span>
      <span class="label">THESIS &middot; 2 / 3</span>
    </div>

    <div class="caption-plate">
      <p class="caption-text phrase-1">the room has not changed &mdash; you have. you are listening at its pace now.</p>
      <p class="caption-text phrase-2">the page where the reader's eye slows; the second movement of a chamber piece.</p>
      <p class="caption-text phrase-3">the hold is the message. nothing competes with the voice in the room.</p>
    </div>
  </div>

  <script>
    (function () {
      window.__sceneTimelines = window.__sceneTimelines || {};
      const root = document.getElementById("scene-thesis");
      const q = (sel) => root.querySelector(sel);

      const grain    = q(".bg-grain");
      const vignette = q(".bg-vignette");
      const halo     = q(".bg-halo");
      const tick     = q(".bg-hairline-tick");
      const ghost    = q(".bg-ghost-type");
      const marker   = q(".beat-marker");
      const plate    = q(".caption-plate");
      const phrase1  = q(".caption-text.phrase-1");
      const phrase2  = q(".caption-text.phrase-2");
      const phrase3  = q(".caption-text.phrase-3");

      const sceneDuration = 11.5;
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(marker,
        { opacity: 0 },
        { opacity: 1, duration: 0.6, ease: "expo.out" }, 0.3);

      tl.fromTo(ghost,
        { opacity: 0 },
        { opacity: 0.04, duration: 1.4, ease: "sine.inOut" }, 0.4);

      tl.fromTo(plate,
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.9, ease: "sine.inOut" }, 0.5);

      tl.fromTo(phrase1,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.8, ease: "sine.inOut" }, 0.65);

      const swap1 = 4.2;
      const swap2 = 8.0;
      const fadeDur = 0.4;

      tl.to(phrase1,
        { opacity: 0, duration: fadeDur, ease: "power1.inOut" }, swap1);
      tl.set(phrase1, { visibility: "hidden" }, swap1 + fadeDur);

      tl.fromTo(phrase2,
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.7, ease: "sine.inOut" }, swap1 + 0.1);

      tl.to(phrase2,
        { opacity: 0, duration: fadeDur, ease: "power1.inOut" }, swap2);
      tl.set(phrase2, { visibility: "hidden" }, swap2 + fadeDur);

      tl.fromTo(phrase3,
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.7, ease: "sine.inOut" }, swap2 + 0.1);

      const grainCycle = 6;
      tl.to(grain,
        { opacity: 0.08, duration: grainCycle, ease: "sine.inOut",
          yoyo: true, repeat: Math.floor(sceneDuration / grainCycle) }, 0);

      const vigCycle = 8;
      tl.to(vignette,
        { scale: 1.04, duration: vigCycle, ease: "sine.inOut",
          yoyo: true, repeat: Math.floor(sceneDuration / vigCycle) }, 0);

      const haloCycle = 4.5;
      tl.to(halo,
        { opacity: 0.14, x: 20, duration: haloCycle, ease: "sine.inOut",
          yoyo: true, repeat: Math.floor(sceneDuration / haloCycle) }, 0);

      const tickCycle = 5;
      tl.to(tick,
        { scaleX: 0.92, duration: tickCycle, ease: "sine.inOut",
          yoyo: true, repeat: Math.floor(sceneDuration / tickCycle) }, 0);

      const ghostCycle = 6;
      tl.to(ghost,
        { y: -12, duration: ghostCycle, ease: "sine.inOut",
          yoyo: true, repeat: Math.floor(sceneDuration / ghostCycle) }, 1.8);

      window.__sceneTimelines["thesis"] = tl;
    })();
  </script>
</div>
