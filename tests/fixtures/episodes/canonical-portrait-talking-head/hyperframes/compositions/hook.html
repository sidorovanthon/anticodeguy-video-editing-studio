<div id="scene-hook" class="scene clip"
     data-start="0.0" data-duration="4.0" data-track-index="1"
     data-width="1080" data-height="1920">
  <style>
    #scene-hook {
      position: absolute;
      inset: 0;
      opacity: 1;
      background-color: #1a1614;
      overflow: hidden;
      font-family: "Inter", sans-serif;
      color: #f4ebdc;
    }
    #scene-hook .scene-content {
      position: absolute;
      inset: 0;
    }
    #scene-hook .bg-grain {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(rgba(244, 235, 220, 0.045) 1px, transparent 1px),
        radial-gradient(rgba(232, 161, 74, 0.035) 1px, transparent 1px);
      background-size: 3px 3px, 5px 5px;
      background-position: 0 0, 1px 2px;
      mix-blend-mode: overlay;
      opacity: 0.10;
      pointer-events: none;
    }
    #scene-hook .bg-vignette {
      position: absolute;
      inset: -4%;
      background: radial-gradient(
        ellipse at 48% 42%,
        rgba(26, 22, 20, 0) 38%,
        rgba(26, 22, 20, 0.45) 88%,
        rgba(26, 22, 20, 0.7) 100%
      );
      pointer-events: none;
      transform-origin: 48% 42%;
    }
    #scene-hook .bg-halo {
      position: absolute;
      top: -120px;
      left: -160px;
      width: 720px;
      height: 720px;
      background: radial-gradient(
        circle at center,
        rgba(232, 161, 74, 0.18) 0%,
        rgba(232, 161, 74, 0.08) 38%,
        rgba(192, 140, 135, 0.04) 65%,
        rgba(232, 161, 74, 0) 80%
      );
      filter: blur(12px);
      pointer-events: none;
      opacity: 0.10;
    }
    #scene-hook .bg-hairline-tick {
      position: absolute;
      top: 80px;
      right: 64px;
      width: 96px;
      height: 1px;
      background: #e8a14a;
      opacity: 0.30;
      transform-origin: right center;
    }
    #scene-hook .beat-marker {
      position: absolute;
      top: 96px;
      left: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
    }
    #scene-hook .beat-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #e8a14a;
      flex-shrink: 0;
    }
    #scene-hook .beat-label {
      font-family: "Inter", sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8a7e72;
      white-space: nowrap;
    }
    #scene-hook .lower-stack {
      position: absolute;
      left: 64px;
      right: 64px;
      bottom: 96px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    #scene-hook .pull-line {
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 3.25rem;
      line-height: 1.2;
      color: #f4ebdc;
      max-width: 70%;
      margin: 0;
      text-transform: lowercase;
      opacity: 0;
    }
    #scene-hook .hairline-rule {
      width: 240px;
      height: 1px;
      background: #e8a14a;
      opacity: 0.6;
      transform-origin: left center;
      margin: 0;
      transform: scaleX(0);
    }
    #scene-hook .caption-plate {
      padding: 28px 64px;
      background: rgba(36, 31, 27, 0.78);
      border-radius: 14px;
      margin: 0;
      box-sizing: border-box;
      opacity: 0;
    }
    #scene-hook .caption-text {
      font-family: "Inter", sans-serif;
      font-size: 1.5rem;
      font-weight: 400;
      line-height: 1.45;
      color: #f4ebdc;
      max-width: 78%;
      text-align: left;
      margin: 0;
      opacity: 0;
    }
  </style>

  <div class="scene-content">
    <div class="bg-grain" aria-hidden="true"></div>
    <div class="bg-vignette" aria-hidden="true"></div>
    <div class="bg-halo" aria-hidden="true"></div>
    <div class="bg-hairline-tick" aria-hidden="true"></div>

    <div class="beat-marker">
      <div class="beat-dot"></div>
      <span class="beat-label">HOOK &middot; 1 / 3</span>
    </div>

    <div class="lower-stack">
      <div class="pull-line">a thought already in motion, before the room knows it&rsquo;s listening.</div>
      <div class="hairline-rule" aria-hidden="true"></div>
      <div class="caption-plate">
        <p class="caption-text">i&rsquo;ve been sitting with something quiet&mdash;</p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__sceneTimelines = window.__sceneTimelines || {};
      const root = document.getElementById("scene-hook");
      const q = (sel) => root.querySelector(sel);

      const sceneDuration = 4.0;
      const finiteCycles = (cycle) => Math.max(0, Math.floor(sceneDuration / cycle));

      const tl = gsap.timeline({ paused: true });

      const grainCycle = 2.0;
      tl.fromTo(q(".bg-grain"),
        { opacity: 0.08 },
        { opacity: 0.13, duration: grainCycle, ease: "sine.inOut",
          yoyo: true, repeat: finiteCycles(grainCycle) },
        0);

      const vignetteCycle = 2.0;
      tl.fromTo(q(".bg-vignette"),
        { scale: 1.0 },
        { scale: 1.04, duration: vignetteCycle, ease: "sine.inOut",
          yoyo: true, repeat: finiteCycles(vignetteCycle) },
        0);

      const haloCycle = 2.0;
      tl.fromTo(q(".bg-halo"),
        { opacity: 0.10, x: 0 },
        { opacity: 0.14, x: 22, duration: haloCycle, ease: "sine.inOut",
          yoyo: true, repeat: finiteCycles(haloCycle) },
        0);

      const tickCycle = 1.5;
      tl.fromTo(q(".bg-hairline-tick"),
        { scaleX: 0.92 },
        { scaleX: 1.0, duration: tickCycle, ease: "sine.inOut",
          yoyo: true, repeat: finiteCycles(tickCycle) },
        0);

      tl.fromTo(q(".beat-marker"),
        { opacity: 0 },
        { opacity: 1, duration: 0.6, ease: "expo.out" },
        0.2);

      tl.fromTo(q(".caption-plate"),
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.9, ease: "sine.inOut" },
        0.5);

      tl.fromTo(q(".caption-text"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" },
        0.65);

      tl.fromTo(q(".hairline-rule"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.7, ease: "power1.out" },
        1.1);

      tl.fromTo(q(".pull-line"),
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.95, ease: "power3.out" },
        1.4);

      window.__sceneTimelines["hook"] = tl;
    })();
  </script>
</div>
