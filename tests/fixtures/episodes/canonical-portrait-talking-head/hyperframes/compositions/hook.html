<div id="scene-hook" class="scene clip"
     data-start="0.0" data-duration="1.2" data-track-index="1"
     data-width="1080" data-height="1920">
  <style>
    #scene-hook {
      position: absolute; inset: 0; opacity: 1; overflow: hidden;
      background: linear-gradient(180deg, #FFF8EC 0%, #E6DFD4 100%);
      font-family: "Inter", system-ui, sans-serif;
      color: #2a2a2a;
    }
    #scene-hook .scene-content { position: absolute; inset: 0; }

    #scene-hook .grain {
      position: absolute; inset: -24px;
      background-image:
        radial-gradient(rgba(42, 42, 42, 0.22) 1px, transparent 1px),
        radial-gradient(rgba(42, 42, 42, 0.14) 1px, transparent 1px);
      background-size: 3px 3px, 5px 5px;
      background-position: 0 0, 1px 2px;
      mix-blend-mode: multiply;
      opacity: 0.04;
      will-change: transform;
      pointer-events: none;
    }

    #scene-hook .speaker-plate {
      position: absolute;
      left: 0; right: 0;
      top: 12%; height: 56%;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(196, 163, 163, 0.55) 0%, rgba(176, 146, 146, 0.32) 38%, rgba(204, 198, 189, 0) 72%),
        linear-gradient(180deg, #E6DFD4 0%, #CCC6BD 100%);
    }

    #scene-hook .speaker-rim {
      position: absolute;
      left: 0; right: 0;
      top: 12%;
      height: 4px;
      background: linear-gradient(90deg, rgba(196, 163, 163, 0) 0%, #C4A3A3 50%, rgba(196, 163, 163, 0) 100%);
      opacity: 0.5;
    }

    #scene-hook .vignette-top {
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 360px;
      background: radial-gradient(ellipse at 50% 0%, #FFFDF8 0%, rgba(255, 253, 248, 0) 75%);
      opacity: 0;
      will-change: opacity;
      pointer-events: none;
    }

    #scene-hook .glow {
      position: absolute;
      left: calc(50% - 360px);
      top: calc(60% - 360px);
      width: 720px; height: 720px;
      background: radial-gradient(circle, #F5A623 0%, rgba(245, 166, 35, 0) 60%);
      opacity: 0.08;
      will-change: transform, opacity;
      pointer-events: none;
    }

    #scene-hook .hairline {
      position: absolute;
      top: 96px; left: 96px; right: 96px;
      height: 1px;
      background: #C4A3A3;
      opacity: 0;
      transform-origin: right center;
      transform: scaleX(0);
      will-change: transform, opacity;
    }

    #scene-hook .corner-mark {
      position: absolute;
      top: 60px; left: 96px;
      font-family: "Inter", sans-serif;
      font-weight: 500;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #404040;
      opacity: 0;
      will-change: transform, opacity;
    }

    #scene-hook .overline {
      position: absolute;
      top: 60px; right: 96px;
      font-family: "Inter", sans-serif;
      font-weight: 500;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #404040;
      opacity: 0;
      will-change: transform, opacity;
    }

    #scene-hook .overline-rule {
      position: absolute;
      top: 84px; right: 96px;
      width: 24px; height: 2px;
      background: #F5A623;
      transform: scaleX(0);
      transform-origin: left center;
      will-change: transform;
    }

    #scene-hook .caption-strip {
      position: absolute;
      left: 96px; right: 96px; bottom: 96px;
      padding: 18px 28px;
      background: rgba(255, 253, 248, 0.82);
      border-radius: 16px;
      font-family: "Inter", sans-serif;
      font-weight: 300;
      font-size: 1.125rem;
      line-height: 1.7;
      color: #404040;
      opacity: 0;
      will-change: transform, opacity;
    }

    #scene-hook .footer-mark {
      position: absolute;
      left: 96px; bottom: 56px;
      font-family: "Inter", sans-serif;
      font-weight: 500;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #404040;
      opacity: 0;
      will-change: transform, opacity;
    }
  </style>

  <div class="scene-content">
    <div class="grain"></div>
    <div class="speaker-plate"></div>
    <div class="speaker-rim"></div>
    <div class="vignette-top"></div>
    <div class="glow"></div>
    <div class="hairline"></div>
    <div class="corner-mark">soft signal</div>
    <div class="overline">01 / Reflection</div>
    <div class="overline-rule"></div>
    <div class="caption-strip">a thought already in motion.</div>
    <div class="footer-mark">take 01 &middot; cream seamless</div>
  </div>

  <script>
    (function () {
      window.__sceneTimelines = window.__sceneTimelines || {};
      const root = document.getElementById("scene-hook");
      const q = (s) => root.querySelector(s);
      const tl = gsap.timeline({ paused: true });

      const sceneDuration = 1.2;

      tl.fromTo(q(".vignette-top"),
        { opacity: 0 },
        { opacity: 0.08, duration: 0.6, ease: "power1.inOut" },
        0.10
      );

      tl.fromTo(q(".hairline"),
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 0.6, duration: 0.6, ease: "sine.out" },
        0.10
      );

      tl.fromTo(q(".overline"),
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.9, ease: "sine.inOut" },
        0.10
      );

      tl.fromTo(q(".corner-mark"),
        { y: 24, opacity: 0 },
        { y: 0, opacity: 0.55, duration: 0.9, ease: "sine.inOut" },
        0.12
      );

      tl.fromTo(q(".overline-rule"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, ease: "power2.out" },
        0.18
      );

      tl.fromTo(q(".caption-strip"),
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.9, ease: "sine.inOut" },
        0.22
      );

      tl.fromTo(q(".footer-mark"),
        { y: 16, opacity: 0 },
        { y: 0, opacity: 0.45, duration: 0.7, ease: "power1.out" },
        0.28
      );

      const glowHalf = 0.6;
      tl.to(q(".glow"),
        {
          scale: 1.04,
          opacity: 0.10,
          duration: glowHalf,
          ease: "sine.inOut",
          yoyo: true,
          repeat: Math.floor(sceneDuration / glowHalf)
        },
        0
      );

      tl.to(q(".grain"),
        { x: 4, y: -3, duration: sceneDuration, ease: "sine.inOut" },
        0
      );

      const hairHalf = 0.6;
      tl.to(q(".hairline"),
        {
          opacity: 0.5,
          duration: hairHalf,
          ease: "sine.inOut",
          yoyo: true,
          repeat: Math.floor(sceneDuration / hairHalf)
        },
        0.6
      );

      window.__sceneTimelines["hook"] = tl;
    })();
  </script>
</div>
