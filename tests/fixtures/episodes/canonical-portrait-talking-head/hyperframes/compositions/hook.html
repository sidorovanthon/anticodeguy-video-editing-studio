<div id="scene-hook" class="scene clip" data-start="0.0" data-duration="3.1" data-track-index="1" data-width="1080" data-height="1920">
  <style>
    #scene-hook { position: absolute; inset: 0; opacity: 1; overflow: hidden; background: #0c0b0a; color: #f3ece0; font-family: "Inter", sans-serif; }
    #scene-hook .sh-vignette { position: absolute; inset: -4%; background: radial-gradient(ellipse at top left, #16140f 0%, #0c0b0a 55%, #050403 100%); transform-origin: 15% 15%; will-change: transform; }
    #scene-hook .sh-grain { position: absolute; inset: 0; opacity: 0.04; pointer-events: none; background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); background-size: 220px 220px; mix-blend-mode: screen; }
    #scene-hook .sh-ghost { position: absolute; top: 10%; right: -3%; font-family: "Playfair Display", serif; font-style: italic; font-weight: 400; font-size: 18rem; line-height: 0.9; letter-spacing: -0.03em; color: #1d1a13; pointer-events: none; will-change: transform; user-select: none; }
    #scene-hook .sh-overline { position: absolute; top: 11%; left: 7%; font-family: "Inter", sans-serif; font-weight: 500; font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.18em; color: #b8a982; }
    #scene-hook .sh-overline span { display: inline-block; opacity: 0; will-change: opacity, transform; }
    #scene-hook .sh-rule { position: absolute; top: calc(11% + 38px); left: 7%; width: 34%; height: 1px; background: #b8a982; opacity: 0.30; transform: scaleX(0); transform-origin: left center; will-change: transform; }
    #scene-hook .sh-headline { position: absolute; top: 30%; left: 7%; width: 60%; font-family: "Playfair Display", serif; font-style: italic; font-weight: 400; font-size: 4.5rem; letter-spacing: -0.02em; line-height: 1.05; color: #f3ece0; opacity: 0; transform: translateY(24px); will-change: opacity, transform; }
    #scene-hook .sh-pull { position: absolute; top: 44%; left: 7%; width: 84%; font-family: "Playfair Display", serif; font-style: italic; font-weight: 400; font-size: 6rem; letter-spacing: -0.025em; line-height: 1.0; color: #fbf6ec; opacity: 0; will-change: opacity; }
    #scene-hook .sh-pull .accent { color: #5a6dd1; }
    #scene-hook .sh-underscore { position: absolute; top: calc(44% + 13rem); left: 7%; width: 46%; height: 2px; background: #988a66; transform: scaleX(0); transform-origin: left center; will-change: transform; }
  </style>
  <div class="sh-vignette"></div>
  <div class="sh-grain"></div>
  <div class="sh-ghost" aria-hidden="true">MEMO</div>
  <div class="sh-overline" aria-label="Episode 01 — A Memo"><span>E</span><span>P</span><span>I</span><span>S</span><span>O</span><span>D</span><span>E</span><span>&nbsp;</span><span>0</span><span>1</span><span>&nbsp;</span><span>&middot;</span><span>&nbsp;</span><span>A</span><span>&nbsp;</span><span>M</span><span>E</span><span>M</span><span>O</span></div>
  <div class="sh-rule"></div>
  <div class="sh-headline">Age of</div>
  <div class="sh-pull"><span class="accent">a</span>rtificial intelligence</div>
  <div class="sh-underscore"></div>
  <script>
    (function () {
      window.__sceneTimelines = window.__sceneTimelines || {};
      const root = document.getElementById("scene-hook");
      const tl = gsap.timeline({ paused: true });
      const sceneDuration = 3.1;

      const vignette = root.querySelector(".sh-vignette");
      const ghost = root.querySelector(".sh-ghost");
      const overlineChars = root.querySelectorAll(".sh-overline span");
      const rule = root.querySelector(".sh-rule");
      const headline = root.querySelector(".sh-headline");
      const pull = root.querySelector(".sh-pull");
      const underscore = root.querySelector(".sh-underscore");

      const breathCycle = 1.55;
      tl.to(vignette, {
        scale: 1.04,
        yoyo: true,
        repeat: Math.floor(sceneDuration / breathCycle),
        duration: breathCycle,
        ease: "sine.inOut"
      }, 0);

      tl.to(ghost, {
        x: -10,
        duration: sceneDuration,
        ease: "sine.inOut"
      }, 0);

      tl.fromTo(overlineChars,
        { opacity: 0, y: 4 },
        { opacity: 1, y: 0, duration: 0.35, stagger: 0.035, ease: "sine.inOut" },
        0.20);

      tl.fromTo(rule,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.8, ease: "expo.out" },
        0.55);

      tl.fromTo(headline,
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 1.0, ease: "sine.inOut" },
        0.95);

      tl.fromTo(pull,
        { opacity: 0 },
        { opacity: 1, duration: 1.2, ease: "sine.inOut" },
        1.45);

      tl.fromTo(underscore,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, ease: "expo.out" },
        2.05);

      const exitStart = sceneDuration - 0.40;
      const exitDur = 0.30;
      const exitTargets = [overlineChars, rule, headline, pull, underscore];
      exitTargets.forEach(function (el) {
        tl.to(el, { opacity: 0, duration: exitDur, ease: "power1.in" }, exitStart);
        tl.set(el, { visibility: "hidden" }, exitStart + exitDur);
      });

      window.__sceneTimelines["hook"] = tl;
    })();
  </script>
</div>
