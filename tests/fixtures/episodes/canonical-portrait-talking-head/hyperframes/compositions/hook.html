<div id="scene-hook" class="scene clip"
     data-start="0.0" data-duration="1.22" data-track-index="1"
     data-width="1080" data-height="1920">
  <style>
    #scene-hook {
      position: absolute;
      inset: 0;
      opacity: 1;
      background: #0a0a0a;
      overflow: hidden;
      font-family: "Inter", sans-serif;
      color: #f0f0f0;
    }
    #scene-hook .hk-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 38% 42%, #0a0a0a 0%, #080808 55%, #050505 100%);
      pointer-events: none;
    }
    #scene-hook .hk-grain {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      background-image:
        repeating-linear-gradient(0deg,   #f0f0f0 0px, #f0f0f0 1px, transparent 1px, transparent 3px),
        repeating-linear-gradient(90deg,  #f0f0f0 0px, #f0f0f0 1px, transparent 1px, transparent 3px);
      mix-blend-mode: overlay;
      pointer-events: none;
    }
    #scene-hook .hk-ghost-numeral {
      position: absolute;
      top: 8%;
      right: 12%;
      font-size: 4rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: #f0f0f0;
      opacity: 0.04;
    }
    #scene-hook .hk-anchor-rule {
      position: absolute;
      left: 12%;
      top: 0;
      width: 1px;
      height: 100%;
      background: #1a237e;
      opacity: 0.30;
      transform-origin: top center;
      will-change: transform, opacity;
    }
    #scene-hook .hk-content {
      position: absolute;
      left: 12%;
      right: 11%;
      top: 26%;
      padding-left: 64px;
    }
    #scene-hook .hk-overline {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #d8d8d8;
      margin: 0 0 16px 0;
    }
    #scene-hook .hk-divider {
      width: 32%;
      height: 1px;
      background: #f0f0f0;
      opacity: 0.10;
      margin: 0 0 32px 0;
      transform-origin: left center;
      will-change: transform;
    }
    #scene-hook .hk-headline {
      font-size: 3rem;
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      line-height: 1.2;
      color: #f0f0f0;
      margin: 0;
      will-change: transform, opacity;
    }
    #scene-hook .hk-emphasized {
      position: relative;
      display: inline-block;
      color: #f0f0f0;
    }
    #scene-hook .hk-emphasized .hk-underline {
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 70%;
      height: 1px;
      background: #1a237e;
      transform: scaleX(0);
      transform-origin: left center;
      will-change: transform;
    }
  </style>
  <div class="scene-content">
    <div class="hk-vignette"></div>
    <div class="hk-grain"></div>
    <div class="hk-ghost-numeral">01</div>
    <div class="hk-anchor-rule"></div>
    <div class="hk-content">
      <p class="hk-overline">01 / Premise</p>
      <div class="hk-divider"></div>
      <h1 class="hk-headline">
        Age of Artificial
        <span class="hk-emphasized">Intelligence<span class="hk-underline"></span></span>
      </h1>
    </div>
  </div>
  <script>
    (function () {
      window.__sceneTimelines = window.__sceneTimelines || {};
      const root = document.getElementById("scene-hook");
      const q = (s) => root.querySelector(s);

      const vignette = q(".hk-vignette");
      const ghost    = q(".hk-ghost-numeral");
      const rule     = q(".hk-anchor-rule");
      const overline = q(".hk-overline");
      const divider  = q(".hk-divider");
      const headline = q(".hk-headline");
      const emph     = q(".hk-emphasized");
      const ulLine   = q(".hk-underline");

      const sceneDuration = 1.22;
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(rule,
        { scaleY: 0, opacity: 0.30 },
        { scaleY: 1, opacity: 0.30, duration: 0.55, ease: "sine.inOut" },
        0.10);

      tl.fromTo(overline,
        { opacity: 0, y: 4 },
        { opacity: 1, y: 0, duration: 0.32, ease: "sine.out" },
        0.12);

      tl.fromTo(divider,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.32, ease: "sine.inOut" },
        0.32);

      tl.fromTo(headline,
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power2.out" },
        0.45);

      tl.fromTo(emph,
        { color: "#f0f0f0" },
        { color: "#ffffff", duration: 0.28, ease: "sine.inOut" },
        0.68);

      tl.fromTo(ulLine,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.30, ease: "power2.out" },
        0.78);

      const vignetteCycle = 0.40;
      tl.to(vignette,
        { opacity: 0.92, yoyo: true,
          repeat: Math.floor(sceneDuration / vignetteCycle),
          duration: vignetteCycle, ease: "sine.inOut" },
        0);

      const ghostCycle = 0.50;
      tl.fromTo(ghost,
        { y: -2 },
        { y: 2, yoyo: true,
          repeat: Math.floor(sceneDuration / ghostCycle),
          duration: ghostCycle, ease: "sine.inOut" },
        0);

      const ruleBreathCycle = 0.45;
      tl.to(rule,
        { opacity: 0.45, yoyo: true,
          repeat: Math.floor(sceneDuration / ruleBreathCycle),
          duration: ruleBreathCycle, ease: "sine.inOut" },
        0.65);

      const fadeStart = sceneDuration - 0.20;
      const fadeDur = 0.18;

      tl.to(overline, { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.to(divider,  { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.to(headline, { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.to(ulLine,   { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);

      tl.set(overline, { visibility: "hidden" }, fadeStart + fadeDur);
      tl.set(divider,  { visibility: "hidden" }, fadeStart + fadeDur);
      tl.set(headline, { visibility: "hidden" }, fadeStart + fadeDur);
      tl.set(ulLine,   { visibility: "hidden" }, fadeStart + fadeDur);

      window.__sceneTimelines["hook"] = tl;
    })();
  </script>
</div>
