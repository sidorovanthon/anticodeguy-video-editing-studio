<div id="scene-hook" class="scene clip"
     data-start="0.0" data-duration="1.34" data-track-index="1"
     data-width="1080" data-height="1920">
  <style>
    #scene-hook {
      position: absolute;
      inset: 0;
      opacity: 1;
      background-color: #1a1614;
      overflow: hidden;
    }

    #scene-hook .scene-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
    }

    #scene-hook .bg-grain {
      position: absolute;
      inset: 0;
      opacity: 0.08;
      pointer-events: none;
      background-color: #1a1614;
      background-image: radial-gradient(circle at 20% 50%, rgba(232, 161, 74, 0.04) 0%, transparent 55%);
    }

    #scene-hook .bg-vignette {
      position: absolute;
      inset: 0;
      opacity: 0.18;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(36, 31, 27, 0.6) 100%);
    }

    #scene-hook .ambient-glow {
      position: absolute;
      bottom: -120px;
      left: -120px;
      width: 540px;
      height: 540px;
      background: radial-gradient(circle at center, rgba(232, 161, 74, 0.08) 0%, transparent 65%);
      pointer-events: none;
    }

    #scene-hook .ambient-rose {
      position: absolute;
      top: -100px;
      right: -100px;
      width: 460px;
      height: 460px;
      background: radial-gradient(circle at center, rgba(192, 140, 135, 0.10) 0%, transparent 65%);
      pointer-events: none;
    }

    #scene-hook .beat-marker {
      position: absolute;
      top: 96px;
      left: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    #scene-hook .beat-marker-dot {
      width: 6px;
      height: 6px;
      background-color: #e8a14a;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #scene-hook .beat-marker-text {
      font-family: Inter, sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #8a7e72;
      white-space: nowrap;
    }

    #scene-hook .lower-stack {
      position: absolute;
      left: 64px;
      right: 64px;
      bottom: 96px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    #scene-hook .pull-line {
      font-family: Playfair Display, serif;
      font-size: 3.25rem;
      font-weight: 400;
      font-style: italic;
      line-height: 1.2;
      color: #f4ebdc;
      max-width: 70%;
      margin: 0;
    }

    #scene-hook .hairline-rule {
      width: 240px;
      height: 1px;
      background-color: #e8a14a;
      opacity: 0.6;
      margin: 0;
      transform-origin: left center;
    }

    #scene-hook .caption-plate {
      padding: 28px;
      background-color: rgba(36, 31, 27, 0.78);
      border-radius: 14px;
      margin: 0;
    }

    #scene-hook .caption-text {
      font-family: Inter, sans-serif;
      font-size: 1.5rem;
      font-weight: 400;
      line-height: 1.45;
      color: #f4ebdc;
      max-width: 78%;
      margin: 0;
    }
  </style>

  <div class="scene-content">
    <div class="bg-grain"></div>
    <div class="bg-vignette"></div>
    <div class="ambient-glow"></div>
    <div class="ambient-rose"></div>

    <div class="beat-marker">
      <div class="beat-marker-dot"></div>
      <span class="beat-marker-text">HOOK &middot; 1 / 3</span>
    </div>

    <div class="lower-stack">
      <div class="pull-line">the age of artificial intelligence</div>
      <div class="hairline-rule"></div>
      <div class="caption-plate">
        <p class="caption-text">age of artificial intelligence.</p>
      </div>
    </div>
  </div>

  <script>
    (function() {
      window.__sceneTimelines = window.__sceneTimelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#scene-hook .bg-grain",
        { x: 0, y: 0 },
        { x: -3, y: -2, duration: 6, ease: "sine.inOut" },
        0
      );

      tl.fromTo("#scene-hook .bg-vignette",
        { scale: 1.0, transformOrigin: "center center" },
        { scale: 1.05, duration: 7, ease: "sine.inOut" },
        0
      );

      tl.fromTo("#scene-hook .ambient-glow",
        { scale: 1.0, transformOrigin: "center center" },
        { scale: 1.08, duration: 8, ease: "sine.inOut" },
        0
      );

      tl.fromTo("#scene-hook .ambient-rose",
        { opacity: 0.0 },
        { opacity: 1.0, duration: 1.2, ease: "power1.out" },
        0
      );

      tl.fromTo("#scene-hook .beat-marker",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "sine.inOut" },
        0.10
      );

      tl.fromTo("#scene-hook .caption-plate",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power2.inOut" },
        0.15
      );

      tl.fromTo("#scene-hook .caption-text",
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power1.out" },
        0.30
      );

      tl.fromTo("#scene-hook .hairline-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.7, ease: "sine.inOut" },
        0.35
      );

      tl.fromTo("#scene-hook .pull-line",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" },
        0.45
      );

      window.__sceneTimelines["hook"] = tl;
    })();
  </script>
</div>
