  <div class="scene-content">
    <div class="pf-speaker-plate"></div>
    <div class="pf-grain"></div>
    <div class="pf-radial-glow"></div>
    <div class="pf-vignette-top"></div>
    <div class="pf-hairline"></div>
    <div class="pf-margin-tick"></div>
    <div class="pf-overline">03 / PAYOFF</div>
    <div class="pf-headline-wrap">
      <h1 class="pf-headline">and that&rsquo;s the quiet part &mdash; the part you keep.</h1>

  <script>
    (function () {
      window.__sceneTimelines = window.__sceneTimelines || {};
      const root = document.getElementById("scene-payoff");
      const q = (sel) => root.querySelector(sel);
      const glow = q(".pf-radial-glow");
      const grain = q(".pf-grain");
      const hairline = q(".pf-hairline");
      const overline = q(".pf-overline");
      const headline = q(".pf-headline");
      const attribution = q(".pf-attribution");
      const vignette = q(".pf-vignette-top");
      const tick = q(".pf-margin-tick");

      const sceneDuration = 10.7;
      const glowCycle = 1.2;
      const grainCycle = 7.4;
      const hairlineCycle = 4.0;
      const fadeStart = 10.3;
      const fadeDur = 0.4;

      const tl = gsap.timeline({ paused: true });

      // Scene container reveal — held opacity:0 until the future transitions node fades it in.
      tl.fromTo(root,
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "sine.inOut" }, 0.0);

      // First content entrance — overline label settles in (offset within 0.1-0.3s).
      tl.fromTo(overline,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.9, ease: "sine.inOut" }, 0.10);

      tl.fromTo(vignette,
        { opacity: 0 },
        { opacity: 1, duration: 0.6, ease: "sine.out" }, 0.10);

      tl.fromTo(hairline,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, ease: "sine.inOut" }, 0.18);

      tl.fromTo(tick,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "sine.out" }, 0.25);

      // Headline (sign-off) surfaces 320ms after the overline starts (DESIGN.md mandate).
      tl.fromTo(headline,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.9, ease: "sine.inOut" }, 0.42);

      tl.fromTo(attribution,
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.9, ease: "sine.inOut" }, 1.20);

      // Ambient: radial glow breathing — finite repeat derived from scene length.
      tl.to(glow, {
        scale: 1.04,
        opacity: 0.14,
        yoyo: true,
        duration: glowCycle,
        ease: "sine.inOut",
        repeat: Math.floor(sceneDuration / glowCycle)
      }, 0);

      // Ambient: warm-grain drift — slow yoyo across the full beat.
      tl.to(grain, {
        x: 4,
        y: -3,
        yoyo: true,
        duration: grainCycle,
        ease: "sine.inOut",
        repeat: Math.floor(sceneDuration / grainCycle)
      }, 0);

      // Ambient: hairline opacity pulse.
      tl.to(hairline, {
        opacity: 0.5,
        yoyo: true,
        duration: hairlineCycle,
        ease: "sine.inOut",
        repeat: Math.floor(sceneDuration / hairlineCycle)
      }, 0.7);

      // HR 4 final-fade (is_final=true): headline + attribution alone fade over the last 0.4s,
      // leaving speaker + cream + ambient atmosphere intact.
      tl.to(headline,    { opacity: 0, duration: fadeDur, ease: "power1.inOut" }, fadeStart);
      tl.to(attribution, { opacity: 0, duration: fadeDur, ease: "power1.inOut" }, fadeStart);
      tl.set(headline,    { visibility: "hidden" }, fadeStart + fadeDur);
      tl.set(attribution, { visibility: "hidden" }, fadeStart + fadeDur);

      window.__sceneTimelines["payoff"] = tl;
    })();
  </script>
</div>
