<div id="scene-payoff" class="scene clip"
     data-start="18.2" data-duration="8.3" data-track-index="1"
     data-width="1080" data-height="1920">
  <style>
    #scene-payoff { position: absolute; inset: 0; opacity: 0; overflow: hidden; background: #0c0b0a; }
    #scene-payoff .vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at top left, #16140f 0%, #0c0b0a 55%, #050403 100%);
      transform-origin: top left;
      will-change: transform;
    }
    #scene-payoff .grain {
      position: absolute; inset: 0; pointer-events: none; opacity: 0.04;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      background-size: 80px 80px;
    }
    #scene-payoff .ghost-roots {
      position: absolute; left: -40px; top: 1160px;
      width: 1180px;
      font-family: "Playfair Display", serif;
      font-style: italic; font-weight: 400;
      font-size: 22rem; line-height: 1.0;
      letter-spacing: -0.03em;
      color: #1d1a13;
      pointer-events: none;
      white-space: nowrap;
    }
    #scene-payoff .overline {
      position: absolute; left: 96px; top: 220px;
      font-family: "Inter", sans-serif;
      font-weight: 500; font-size: 0.8125rem;
      text-transform: uppercase; letter-spacing: 0.18em;
      color: #b8a982;
    }
    #scene-payoff .hairline {
      position: absolute; height: 1px;
      background: #b8a982; opacity: 0.30;
      transform-origin: left center;
    }
    #scene-payoff .hairline-upper { left: 96px; top: 280px; width: 380px; }
    #scene-payoff .hairline-lower { left: 96px; top: 1140px; width: 820px; }
    #scene-payoff .headline {
      position: absolute; left: 96px; top: 360px;
      width: 720px;
      font-family: "Playfair Display", serif;
      font-style: italic; font-weight: 400;
      font-size: 4.5rem; line-height: 1.05;
      letter-spacing: -0.02em;
      color: #d9d2c5;
    }
    #scene-payoff .pullquote {
      position: absolute; left: 96px; top: 500px;
      width: 920px;
      font-family: "Playfair Display", serif;
      font-style: italic; font-weight: 400;
      font-size: 6rem; line-height: 1.0;
      letter-spacing: -0.025em;
      color: #fbf6ec;
    }
    #scene-payoff .pullquote .keystone {
      color: #fbf6ec; display: inline-block;
    }
    #scene-payoff .underscore-roots {
      position: absolute;
      left: 96px; top: 710px; width: 296px; height: 2px;
      background: #988a66;
      transform-origin: left center;
    }
    #scene-payoff .body-line {
      position: absolute;
      width: 760px; left: 96px;
      font-family: "Inter", sans-serif;
      font-weight: 300; font-size: 1.15rem; line-height: 1.6;
      max-width: 56ch;
    }
    #scene-payoff .body-line-1 { top: 1200px; color: #f3ece0; }
    #scene-payoff .body-line-2 { top: 1330px; color: #bfb8ab; }
    #scene-payoff .body-line .w { display: inline-block; }
    #scene-payoff .tick {
      position: absolute; right: 96px; top: 1720px;
      font-family: "Inter", sans-serif;
      font-weight: 300; font-size: 1rem;
      color: #b8a982; opacity: 0.45;
    }
  </style>
  <div class="scene-content">
    <div class="vignette"></div>
    <div class="ghost-roots">roots</div>
    <div class="grain"></div>
    <div class="overline">&sect; 04 &mdash; A MEMO TO MYSELF</div>
    <div class="hairline hairline-upper"></div>
    <div class="hairline hairline-lower"></div>
    <div class="headline">I thought,</div>
    <div class="pullquote">Why don&rsquo;t we return to the <span class="keystone">roots</span></div>
    <div class="underscore-roots"></div>
    <div class="body-line body-line-1"><span class="w">good</span> <span class="w">old</span> <span class="w">software</span> <span class="w">that</span> <span class="w">you</span> <span class="w">pay</span> <span class="w">for</span> <span class="w">once</span> <span class="w">and</span> <span class="w">use</span> <span class="w">for</span> <span class="w">life.</span></div>
    <div class="body-line body-line-2"><span class="w">Yes,</span> <span class="w">maybe</span> <span class="w">it&rsquo;s</span> <span class="w">not</span> <span class="w">as</span> <span class="w">interesting</span> <span class="w">from</span> <span class="w">a</span> <span class="w">business</span> <span class="w">point-of-view,</span> <span class="w">but</span> <span class="w">how</span> <span class="w">cool</span> <span class="w">is</span> <span class="w">it</span> <span class="w">to</span></div>
    <div class="tick">+</div>
  </div>
  <script>
    (function() {
      window.__sceneTimelines = window.__sceneTimelines || {};
      const root = document.getElementById("scene-payoff");
      const sel = (s) => root.querySelector(s);
      const all = (s) => Array.from(root.querySelectorAll(s));
      const sceneDuration = 8.3;

      const vignette  = sel(".vignette");
      const ghost     = sel(".ghost-roots");
      const overline  = sel(".overline");
      const hairlineU = sel(".hairline-upper");
      const hairlineL = sel(".hairline-lower");
      const headline  = sel(".headline");
      const pullquote = sel(".pullquote");
      const keystone  = sel(".pullquote .keystone");
      const underscore = sel(".underscore-roots");
      const body1Words = all(".body-line-1 .w");
      const body2Words = all(".body-line-2 .w");
      const tick      = sel(".tick");

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(overline,  { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.6, ease: "sine.inOut" }, 0.2);
      tl.fromTo(hairlineU, { scaleX: 0 },         { scaleX: 1,        duration: 0.8, ease: "expo.out"  }, 0.4);
      tl.fromTo(headline,  { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.8, ease: "sine.inOut" }, 0.6);
      tl.fromTo(pullquote, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 1.2, ease: "sine.inOut" }, 1.0);
      tl.to(keystone,      { color: "#5a6dd1",                       duration: 0.5, ease: "power1.inOut" }, 1.9);
      tl.fromTo(underscore,{ scaleX: 0 },         { scaleX: 1,        duration: 0.6, ease: "expo.out"  }, 2.2);
      tl.fromTo(hairlineL, { scaleX: 0 },         { scaleX: 1,        duration: 1.0, ease: "expo.out"  }, 2.6);
      tl.fromTo(body1Words,{ opacity: 0, y: 8 },  { opacity: 1, y: 0, duration: 0.5, ease: "sine.inOut", stagger: 0.06 }, 3.0);
      tl.fromTo(body2Words,{ opacity: 0, y: 8 },  { opacity: 1, y: 0, duration: 0.55, ease: "sine.out",  stagger: 0.08 }, 4.4);

      const breathCycle = 3.0;
      tl.to(vignette,  { scale: 1.04, transformOrigin: "top left", ease: "sine.inOut", duration: breathCycle, yoyo: true, repeat: Math.floor(sceneDuration / breathCycle) }, 0);
      const driftCycle = 4.0;
      tl.to(ghost,     { x: 8,                                       ease: "sine.inOut", duration: driftCycle,  yoyo: true, repeat: Math.floor(sceneDuration / driftCycle) }, 0);
      const ghostOpCycle = 4.0;
      tl.to(ghost,     { opacity: 0.7,                               ease: "sine.inOut", duration: ghostOpCycle, yoyo: true, repeat: Math.floor(sceneDuration / ghostOpCycle) }, 0);
      const pulseCycle = 2.6;
      tl.to([hairlineU, hairlineL], { opacity: 0.35,                 ease: "sine.inOut", duration: pulseCycle,  yoyo: true, repeat: Math.floor(sceneDuration / pulseCycle) }, 0);
      const tickCycle = 2.0;
      tl.to(tick,      { opacity: 0.65,                              ease: "sine.inOut", duration: tickCycle,   yoyo: true, repeat: Math.floor(sceneDuration / tickCycle) }, 0);

      const fadeStart = sceneDuration - 0.7;
      const fadeDur   = 0.6;
      const fadeEnd   = fadeStart + fadeDur;
      const exits = [overline, hairlineU, hairlineL, headline, pullquote, underscore, tick, ghost];
      exits.forEach((el) => {
        tl.to(el,  { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
        tl.set(el, { visibility: "hidden" }, fadeEnd);
      });
      tl.to(body1Words,  { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(body1Words, { visibility: "hidden" }, fadeEnd);
      tl.to(body2Words,  { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(body2Words, { visibility: "hidden" }, fadeEnd);

      window.__sceneTimelines["payoff"] = tl;
    })();
  </script>
</div>
