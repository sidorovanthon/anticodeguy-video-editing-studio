<div id="scene-problem" class="scene clip"
     data-start="2.0" data-duration="11.5" data-track-index="1"
     data-width="1080" data-height="1920">
  <style>
    #scene-problem {
      position: absolute;
      inset: 0;
      opacity: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 60%, #1a1611 0%, transparent 60%),
        linear-gradient(180deg, #0d0b08 0%, #0a0907 55%, #060504 100%);
      font-family: "Inter", sans-serif;
      color: #f4ede0;
    }

    #scene-problem .scene-content {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 96px 64px;
      box-sizing: border-box;
    }

    #scene-problem .pr-grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.06;
      background-image:
        radial-gradient(rgba(244, 237, 224, 0.5) 1px, transparent 1px),
        radial-gradient(rgba(244, 237, 224, 0.35) 1px, transparent 1px);
      background-size: 3px 3px, 7px 7px;
      background-position: 0 0, 1px 2px;
      mix-blend-mode: screen;
    }

    #scene-problem .pr-glow {
      position: absolute;
      left: -10%;
      top: 25%;
      width: 120%;
      height: 70%;
      pointer-events: none;
      background: radial-gradient(circle at 50% 60%, rgba(200, 160, 75, 0.18) 0%, rgba(200, 160, 75, 0.08) 35%, transparent 65%);
      opacity: 0.05;
      filter: blur(2px);
    }

    #scene-problem .pr-rail {
      position: absolute;
      left: 64px;
      top: 0;
      width: 1px;
      height: 100%;
      background: #b48f43;
      opacity: 0.6;
      transform-origin: top center;
    }

    #scene-problem .pr-column-rule {
      position: absolute;
      left: 33%;
      top: 8%;
      width: 1px;
      height: 84%;
      background: #5f5440;
      opacity: 0.25;
    }

    #scene-problem .pr-ground-line {
      position: absolute;
      left: 64px;
      right: 64px;
      bottom: 22%;
      height: 1px;
      background: #a07e3b;
      opacity: 0;
      transform-origin: left center;
      transform: scaleX(0);
    }

    #scene-problem .pr-ghost-word {
      position: absolute;
      left: -3%;
      top: 4%;
      font-family: "Inter", sans-serif;
      font-weight: 300;
      font-size: 11rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f4ede0;
      opacity: 0;
      white-space: nowrap;
      pointer-events: none;
    }

    #scene-problem .pr-role-chip {
      position: absolute;
      left: 128px;
      top: 18%;
      max-width: 50%;
      font-family: "Inter", sans-serif;
      font-weight: 400;
      font-size: 0.875rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6b5e48;
      line-height: 1.6;
      opacity: 0;
    }

    #scene-problem .pr-role-chip .pr-role-caret {
      display: inline-block;
      width: 0.5em;
      color: #c8a04b;
    }

    #scene-problem .pr-timecode {
      position: absolute;
      right: 64px;
      top: 96px;
      font-family: "Inter", sans-serif;
      font-weight: 400;
      font-size: 0.875rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6b5e48;
      font-variant-numeric: tabular-nums;
      opacity: 0;
    }

    #scene-problem .pr-timecode .pr-tc-num {
      color: #dcd5c9;
    }

    #scene-problem .pr-caption {
      position: absolute;
      left: 128px;
      right: 64px;
      bottom: 12%;
      font-family: "Inter", sans-serif;
      font-weight: 300;
      font-size: 1.7rem;
      line-height: 1.6;
      color: #dcd5c9;
      letter-spacing: 0.01em;
    }

    #scene-problem .pr-caption .pr-cap-line {
      display: block;
      opacity: 0;
    }

    #scene-problem .pr-caption .pr-cap-mark-wrap {
      position: relative;
      display: inline-block;
      padding: 0 0.05em;
    }

    #scene-problem .pr-caption .pr-cap-marker {
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 100%;
      height: 2px;
      background: #d6b466;
      transform-origin: left center;
      transform: scaleX(0);
    }

    #scene-problem .pr-cap-divider {
      position: absolute;
      left: 128px;
      width: 64px;
      height: 1px;
      bottom: calc(12% + 4.4rem);
      background: #5f5440;
      opacity: 0;
      transform-origin: left center;
      transform: scaleX(0);
    }
  </style>
  <div class="scene-content">
    <div class="pr-glow" aria-hidden="true"></div>
    <div class="pr-grain" aria-hidden="true"></div>
    <div class="pr-column-rule" aria-hidden="true"></div>
    <div class="pr-ghost-word" aria-hidden="true">OPEN&nbsp;SOURCE</div>
    <div class="pr-rail" aria-hidden="true"></div>
    <div class="pr-ground-line" aria-hidden="true"></div>
    <div class="pr-role-chip">
      <span class="pr-role-text">Open-Source / Self-Built Tools</span><span class="pr-role-caret">_</span>
    </div>
    <div class="pr-timecode">EP·01 / <span class="pr-tc-num">00:02</span></div>
    <div class="pr-cap-divider" aria-hidden="true"></div>
    <div class="pr-caption">
      <span class="pr-cap-line pr-cap-line-1">I'm increasingly using free, open-source tools,</span>
      <span class="pr-cap-line pr-cap-line-2">deployed by <span class="pr-cap-mark-wrap">AI agents<span class="pr-cap-marker"></span></span>, to write the software</span>
      <span class="pr-cap-line pr-cap-line-3">I rely on for work — quietly, day after day.</span>
    </div>
  </div>
  <script>
    (function () {
      window.__sceneTimelines = window.__sceneTimelines || {};
      const root = document.getElementById("scene-problem");
      const sceneDuration = 11.5;
      const tl = gsap.timeline({ paused: true });

      const glow = root.querySelector(".pr-glow");
      const grain = root.querySelector(".pr-grain");
      const rail = root.querySelector(".pr-rail");
      const column = root.querySelector(".pr-column-rule");
      const ground = root.querySelector(".pr-ground-line");
      const ghost = root.querySelector(".pr-ghost-word");
      const chip = root.querySelector(".pr-role-chip");
      const chipText = root.querySelector(".pr-role-text");
      const chipCaret = root.querySelector(".pr-role-caret");
      const timecode = root.querySelector(".pr-timecode");
      const tcNum = root.querySelector(".pr-tc-num");
      const capDivider = root.querySelector(".pr-cap-divider");
      const capLine1 = root.querySelector(".pr-cap-line-1");
      const capLine2 = root.querySelector(".pr-cap-line-2");
      const capLine3 = root.querySelector(".pr-cap-line-3");
      const capMarker = root.querySelector(".pr-cap-marker");

      // Rail draw + breathing
      tl.fromTo(rail,
        { scaleY: 0, opacity: 0.4, transformOrigin: "top center" },
        { scaleY: 1, opacity: 0.6, duration: 0.9, ease: "sine.inOut" },
        0.1);

      // Ambient glow breathing — finite repeat from sceneDuration
      const glowCycle = 6.0;
      tl.fromTo(glow,
        { opacity: 0.05 },
        { opacity: 0.10, duration: glowCycle / 2, ease: "sine.inOut",
          yoyo: true, repeat: Math.floor(sceneDuration / glowCycle) },
        0);

      // Rail breathing — finite cycle
      const railCycle = 6.0;
      tl.to(rail,
        { opacity: 0.9, duration: railCycle / 2, ease: "sine.inOut",
          yoyo: true, repeat: Math.floor(sceneDuration / railCycle) },
        0.9);

      // Grain fades to its resting opacity
      tl.fromTo(grain,
        { opacity: 0 },
        { opacity: 0.06, duration: 0.8, ease: "sine.inOut" },
        0.15);

      // Column rule drifts horizontally — finite cycle
      const driftCycle = 5.0;
      tl.fromTo(column,
        { x: -2, opacity: 0 },
        { opacity: 0.25, duration: 0.6, ease: "sine.inOut" },
        0.2);
      tl.to(column,
        { x: 2, duration: driftCycle / 2, ease: "sine.inOut",
          yoyo: true, repeat: Math.floor(sceneDuration / driftCycle) },
        0.6);

      // Ghost atmospheric word — fade in + slow drift
      tl.fromTo(ghost,
        { opacity: 0, y: -8 },
        { opacity: 0.04, duration: 1.2, ease: "sine.inOut" },
        0.3);
      const ghostCycle = 8.0;
      tl.to(ghost,
        { y: 8, duration: ghostCycle / 2, ease: "sine.inOut",
          yoyo: true, repeat: Math.floor(sceneDuration / ghostCycle) },
        1.0);

      // Role chip enters then types
      tl.fromTo(chip,
        { opacity: 0, x: -12 },
        { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" },
        0.25);
      tl.fromTo(chipText,
        { clipPath: "inset(0 100% 0 0)" },
        { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power2.out" },
        0.4);
      tl.fromTo(chipCaret,
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" },
        0.4);
      // caret blink — finite repeat
      const caretCycle = 0.9;
      tl.to(chipCaret,
        { opacity: 0.2, duration: caretCycle / 2, ease: "sine.inOut",
          yoyo: true, repeat: Math.floor((sceneDuration - 1.2) / caretCycle) },
        1.0);

      // Timecode chip
      tl.fromTo(timecode,
        { opacity: 0, y: -6 },
        { opacity: 1, y: 0, duration: 0.6, ease: "sine.inOut" },
        0.45);

      // Timecode count-up 00:02 → 00:13 across the beat
      const tcState = { v: 2 };
      tl.to(tcState,
        { v: 13, duration: sceneDuration - 1.2, ease: "none",
          onUpdate: () => {
            const s = Math.floor(tcState.v);
            tcNum.textContent = "00:" + (s < 10 ? "0" + s : s);
          } },
        0.5);

      // Caption divider draws
      tl.fromTo(capDivider,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 0.55, duration: 0.5, ease: "expo.out" },
        0.55);

      // Captions arrive on phrase boundaries
      tl.fromTo(capLine1,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
        0.7);
      tl.fromTo(capLine2,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
        3.6);
      tl.fromTo(capLine3,
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
        7.1);

      // Marker sweep under "AI agents"
      tl.fromTo(capMarker,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "expo.out" },
        4.2);

      // Ground line — slow draw, signals settling argument
      tl.fromTo(ground,
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 0.45, duration: 1.6, ease: "sine.inOut" },
        2.0);

      // Exit pairs — every authored element gets fade + visibility kill
      // before the scene ends. Transitions own the container fade.
      const fadeDur = 0.35;
      const fadeStart = sceneDuration - 0.5;

      tl.to(chip,         { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(chip,        { visibility: "hidden" }, fadeStart + fadeDur);
      tl.to(timecode,     { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(timecode,    { visibility: "hidden" }, fadeStart + fadeDur);
      tl.to(capLine1,     { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(capLine1,    { visibility: "hidden" }, fadeStart + fadeDur);
      tl.to(capLine2,     { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(capLine2,    { visibility: "hidden" }, fadeStart + fadeDur);
      tl.to(capLine3,     { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(capLine3,    { visibility: "hidden" }, fadeStart + fadeDur);
      tl.to(capDivider,   { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(capDivider,  { visibility: "hidden" }, fadeStart + fadeDur);
      tl.to(ghost,        { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(ghost,       { visibility: "hidden" }, fadeStart + fadeDur);
      tl.to(ground,       { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(ground,      { visibility: "hidden" }, fadeStart + fadeDur);

      window.__sceneTimelines["problem"] = tl;
    })();
  </script>
</div>
