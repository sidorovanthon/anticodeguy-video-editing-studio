<div id="scene-pivot" class="scene clip"
     data-start="14.4" data-duration="3.8" data-track-index="1"
     data-width="1080" data-height="1920">
  <style>
    #scene-pivot {
      position: absolute;
      inset: 0;
      opacity: 0;
      overflow: hidden;
      background: #0c0b0a;
      font-family: "Inter", sans-serif;
      color: #f3ece0;
    }
    #scene-pivot .pivot-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at top left, #1d1a13 0%, #0c0b0a 55%, #050403 100%);
      transform-origin: top left;
      will-change: transform;
    }
    #scene-pivot .pivot-grain {
      position: absolute;
      inset: 0;
      opacity: 0.04;
      pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2' seed='5'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      mix-blend-mode: overlay;
    }
    #scene-pivot .pivot-ghost {
      position: absolute;
      top: 320px;
      right: -60px;
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 16rem;
      color: #16140f;
      letter-spacing: -0.04em;
      line-height: 1;
      pointer-events: none;
      will-change: transform;
    }
    #scene-pivot .pivot-overline {
      position: absolute;
      top: 230px;
      left: 96px;
      font-family: "Inter", sans-serif;
      font-weight: 500;
      font-size: 0.8125rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #b8a982;
      opacity: 0;
    }
    #scene-pivot .pivot-rule {
      position: absolute;
      top: 290px;
      left: 96px;
      width: 380px;
      height: 1px;
      background: #b8a982;
      opacity: 0.30;
      transform: scaleX(0);
      transform-origin: left center;
    }
    #scene-pivot .pivot-headline {
      position: absolute;
      top: 560px;
      left: 96px;
      width: 720px;
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 4.5rem;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: #f3ece0;
      opacity: 0;
    }
    #scene-pivot .pivot-pullquote {
      position: absolute;
      top: 780px;
      left: 96px;
      width: 880px;
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 6rem;
      letter-spacing: -0.025em;
      line-height: 1.0;
      color: #fbf6ec;
      display: flex;
      flex-wrap: wrap;
      column-gap: 0.32em;
      row-gap: 0;
      data-layout-allow-overflow: true;
    }
    #scene-pivot .pivot-word {
      position: relative;
      display: inline-block;
      opacity: 0;
      transform: translateY(24px);
    }
    #scene-pivot .pivot-ellipsis {
      color: #fbf6ec;
    }
    #scene-pivot .pivot-strike {
      position: absolute;
      top: 56%;
      left: -2%;
      height: 3px;
      width: 104%;
      background: #988a66;
      transform: scaleX(0);
      transform-origin: left center;
      pointer-events: none;
    }
  </style>
  <div class="scene-content">
    <div class="pivot-vignette"></div>
    <div class="pivot-ghost">THOUGHT</div>
    <div class="pivot-overline">&sect; 03 &mdash; A FALSE START</div>
    <div class="pivot-rule"></div>
    <div class="pivot-headline">I thought,</div>
    <div class="pivot-pullquote">
      <span class="pivot-word">Why</span>
      <span class="pivot-word">don&rsquo;t</span>
      <span class="pivot-word">we</span>
      <span class="pivot-word pivot-word-turn">turn<span class="pivot-strike"></span></span>
      <span class="pivot-word pivot-ellipsis">&hellip;</span>
    </div>
    <div class="pivot-grain"></div>
  </div>
  <script>
    (function () {
      window.__sceneTimelines = window.__sceneTimelines || {};
      const tl = gsap.timeline({ paused: true });
      const sceneDuration = 3.8;

      const scope = document.getElementById("scene-pivot");
      const vignette = scope.querySelector(".pivot-vignette");
      const ghost = scope.querySelector(".pivot-ghost");
      const overline = scope.querySelector(".pivot-overline");
      const rule = scope.querySelector(".pivot-rule");
      const headline = scope.querySelector(".pivot-headline");
      const words = scope.querySelectorAll(".pivot-word");
      const ellipsis = scope.querySelector(".pivot-ellipsis");
      const strike = scope.querySelector(".pivot-strike");

      // Ambient BG-1: vignette breath, finite count fitting scene duration.
      const breathCycle = 1.2;
      tl.fromTo(
        vignette,
        { scale: 1.00 },
        {
          scale: 1.04,
          duration: breathCycle,
          ease: "sine.inOut",
          yoyo: true,
          repeat: Math.floor(sceneDuration / breathCycle)
        },
        0
      );

      // Ambient BG-2: ghost type slow drift (single pass over scene length).
      tl.fromTo(
        ghost,
        { x: 0, y: 0 },
        { x: -10, y: 6, duration: sceneDuration, ease: "sine.inOut" },
        0
      );

      // FG-1: overline fades in.
      tl.fromTo(
        overline,
        { opacity: 0, y: 6 },
        { opacity: 1, y: 0, duration: 0.6, ease: "sine.inOut" },
        0.1
      );

      // FG-2: hairline rule DRAWS left to right.
      tl.fromTo(
        rule,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, ease: "expo.out" },
        0.2
      );

      // MG-1: headline floats up.
      tl.fromTo(
        headline,
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.8, ease: "sine.inOut" },
        0.4
      );

      // MG-2: pullquote settles in, word by word.
      tl.fromTo(
        words,
        { opacity: 0, y: 24 },
        {
          opacity: 1,
          y: 0,
          duration: 0.6,
          ease: "sine.inOut",
          stagger: 0.18
        },
        1.0
      );

      // FG-3: strikethrough DRAWS through the word 'turn' in the final beat.
      tl.fromTo(
        strike,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power2.in" },
        2.6
      );

      // Accent glyph swap: the ellipsis becomes indigo the instant the strike lands.
      tl.set(ellipsis, { color: "#5a6dd1" }, 3.1);

      // Exit-pair on every authored element — kill before data-duration ends so
      // nothing bleeds into the next scene's slot.
      const fadeStart = 3.45;
      const fadeDur = 0.3;
      const fading = [overline, rule, headline, ...Array.from(words), strike];
      tl.to(fading, { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(fading, { visibility: "hidden" }, fadeStart + fadeDur);

      window.__sceneTimelines["pivot"] = tl;
    })();
  </script>
</div>
