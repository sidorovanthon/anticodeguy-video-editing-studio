<div id="scene-pivot" class="scene clip"
     data-start="13.5" data-duration="2.5" data-track-index="1"
     data-width="1080" data-height="1920">
  <style>
    #scene-pivot {
      position: absolute;
      inset: 0;
      opacity: 0;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 70%, var(--background-highlight-1, #1a1611) 0%, transparent 60%),
        linear-gradient(180deg, #0d0b08 0%, #0a0907 55%, #060504 100%);
      color: #f4ede0;
      font-family: "Inter", sans-serif;
    }

    #scene-pivot .scene-content {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 96px 64px;
      box-sizing: border-box;
    }

    #scene-pivot .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.05;
      background-image:
        radial-gradient(rgba(244, 237, 224, 0.6) 0.5px, transparent 0.6px),
        radial-gradient(rgba(244, 237, 224, 0.4) 0.5px, transparent 0.6px);
      background-size: 3px 3px, 5px 5px;
      background-position: 0 0, 1px 2px;
      mix-blend-mode: overlay;
    }

    #scene-pivot .ambient-glow {
      position: absolute;
      left: 50%;
      top: 60%;
      width: 1400px;
      height: 1400px;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 50% 50%, #c8a04b 0%, rgba(200, 160, 75, 0.0) 65%);
      opacity: 0;
      pointer-events: none;
    }

    #scene-pivot .ghost-word {
      position: absolute;
      top: 110px;
      right: 48px;
      font-family: "Inter", sans-serif;
      font-weight: 300;
      font-size: 12rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #f4ede0;
      opacity: 0;
      line-height: 1;
      pointer-events: none;
      white-space: nowrap;
    }

    #scene-pivot .rail {
      position: absolute;
      top: 0;
      left: 64px;
      width: 1px;
      height: 100%;
      background: #b48f43;
      opacity: 0;
      transform-origin: top center;
    }

    #scene-pivot .ground-line {
      position: absolute;
      left: 64px;
      right: 64px;
      bottom: 312px;
      height: 1px;
      background: #a07e3b;
      opacity: 0;
      transform: scaleX(0);
      transform-origin: left center;
    }

    #scene-pivot .timecode {
      position: absolute;
      top: 96px;
      right: 64px;
      font-family: "Inter", sans-serif;
      font-weight: 400;
      font-size: 0.875rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6b5e48;
      font-variant-numeric: tabular-nums;
      opacity: 0;
    }

    #scene-pivot .kicker {
      position: absolute;
      top: 240px;
      left: 154px;
      font-family: "Inter", sans-serif;
      font-weight: 400;
      font-size: 0.875rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6b5e48;
      opacity: 0;
    }

    #scene-pivot .pull-quote {
      position: absolute;
      left: 154px;
      right: 200px;
      bottom: 460px;
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-weight: 400;
      font-size: 3rem;
      line-height: 1.25;
      color: #f4ede0;
      opacity: 0;
    }

    #scene-pivot .pull-rule {
      position: absolute;
      left: 154px;
      bottom: 432px;
      width: 240px;
      height: 1px;
      background: #b48f43;
      opacity: 0;
      transform: scaleX(0);
      transform-origin: left center;
    }

    #scene-pivot .marginalia {
      position: absolute;
      right: 80px;
      bottom: 472px;
      width: 6px;
      height: 6px;
      border-radius: 1px;
      background: #c8a04b;
      opacity: 0;
    }
  </style>

  <div class="scene-content">
    <div class="grain"></div>
    <div class="ambient-glow"></div>
    <div class="ghost-word">THOUGHT</div>
    <div class="rail"></div>
    <div class="ground-line"></div>
    <div class="timecode">EP&middot;01 / 00:13</div>
    <div class="kicker">A Quiet Turn</div>
    <div class="pull-quote">I thought&hellip;</div>
    <div class="pull-rule"></div>
    <div class="marginalia"></div>
  </div>

  <script>
    (function () {
      window.__sceneTimelines = window.__sceneTimelines || {};
      const tl = gsap.timeline({ paused: true });

      const scene       = document.getElementById("scene-pivot");
      const grain       = scene.querySelector(".grain");
      const glow        = scene.querySelector(".ambient-glow");
      const ghost       = scene.querySelector(".ghost-word");
      const rail        = scene.querySelector(".rail");
      const groundLine  = scene.querySelector(".ground-line");
      const timecode    = scene.querySelector(".timecode");
      const kicker      = scene.querySelector(".kicker");
      const pullQuote   = scene.querySelector(".pull-quote");
      const pullRule    = scene.querySelector(".pull-rule");
      const marginalia  = scene.querySelector(".marginalia");

      const sceneDuration = 2.5;
      const fadeDur       = 0.3;
      const fadeStart     = sceneDuration - fadeDur - 0.05;

      // Scene container fade-in (transitions node will manage scene-to-scene exits;
      // visibility shim still needs the container to lift in-scene).
      tl.fromTo(scene,
        { opacity: 0 },
        { opacity: 1, duration: 0.25, ease: "sine.inOut" }, 0);

      // Grain holds steady (atmosphere baseline).
      tl.fromTo(grain,
        { opacity: 0 },
        { opacity: 0.05, duration: 0.4, ease: "sine.inOut" }, 0);

      // Ambient brass glow — entrance, then a finite breath cycle for the scene.
      tl.fromTo(glow,
        { opacity: 0 },
        { opacity: 0.10, duration: 0.6, ease: "sine.inOut" }, 0);
      const glowCycle  = 1.2;
      const glowRepeat = Math.floor(sceneDuration / glowCycle);
      tl.to(glow,
        { opacity: 0.06, duration: glowCycle, ease: "sine.inOut",
          yoyo: true, repeat: glowRepeat }, 0.6);

      // Vertical brass rail — breathing finite cycle.
      tl.fromTo(rail,
        { opacity: 0, scaleY: 0.85 },
        { opacity: 0.7, scaleY: 1, duration: 0.5, ease: "sine.inOut" }, 0);
      const railCycle  = 1.25;
      const railRepeat = Math.floor(sceneDuration / railCycle);
      tl.to(rail,
        { opacity: 0.9, duration: railCycle, ease: "sine.inOut",
          yoyo: true, repeat: railRepeat }, 0.5);

      // Ghost word "THOUGHT" — quiet drift (mirrors HOOK bookend, top-right).
      tl.fromTo(ghost,
        { opacity: 0, y: 12 },
        { opacity: 0.04, y: 0, duration: 0.8, ease: "sine.inOut" }, 0.05);
      const driftCycle  = 1.25;
      const driftRepeat = Math.floor(sceneDuration / driftCycle);
      tl.to(ghost,
        { y: 8, duration: driftCycle, ease: "sine.inOut",
          yoyo: true, repeat: driftRepeat }, 0.85);

      // Timecode chip.
      tl.fromTo(timecode,
        { opacity: 0, y: -6 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.18);

      // Editorial kicker, sets context above the pull quote.
      tl.fromTo(kicker,
        { opacity: 0, x: -10 },
        { opacity: 0.85, x: 0, duration: 0.55, ease: "power2.out" }, 0.22);

      // The pivot itself — the single italic gesture.
      tl.fromTo(pullQuote,
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 1.0, ease: "expo.out" }, 0.28);

      // Short brass hairline draws beneath the quote.
      tl.fromTo(pullRule,
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.6, ease: "expo.out" }, 0.46);

      // Tiny marginalia tick — a single accent dot in the right margin.
      tl.fromTo(marginalia,
        { opacity: 0, scale: 0 },
        { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 0.62);

      // Quiet ground line drift to suggest the page settling.
      tl.fromTo(groundLine,
        { opacity: 0, scaleX: 0 },
        { opacity: 0.2, scaleX: 1, duration: 1.0, ease: "sine.inOut" }, 0.30);

      // Hard exits — every non-trivial element gets a fade + visibility kill
      // before the scene's data-duration ends, so nothing bleeds into PAYOFF.
      const killAt = fadeStart + fadeDur;

      tl.to(pullQuote,  { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(pullQuote, { visibility: "hidden" }, killAt);

      tl.to(pullRule,   { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(pullRule,  { visibility: "hidden" }, killAt);

      tl.to(kicker,     { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(kicker,    { visibility: "hidden" }, killAt);

      tl.to(timecode,   { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(timecode,  { visibility: "hidden" }, killAt);

      tl.to(marginalia, { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(marginalia,{ visibility: "hidden" }, killAt);

      tl.to(ghost,      { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(ghost,     { visibility: "hidden" }, killAt);

      tl.to(groundLine, { opacity: 0, duration: fadeDur, ease: "power1.in" }, fadeStart);
      tl.set(groundLine,{ visibility: "hidden" }, killAt);

      window.__sceneTimelines["pivot"] = tl;
    })();
  </script>
</div>
