# graph/config.yaml — read by build_graph() at startup. Restart `langgraph dev`
# to pick up changes. Glob patterns supported in node_overrides keys (fnmatch).

backend_preference: ["claude", "codex"]

# HOM-212: per-gate deterministic config (thresholds, carve-out lists).
# Schema decided per-gate; see each gate module for canonical defaults.
gates:
  animation_map:
    # Dead zones longer than this threshold (seconds) flip from advisory
    # to blocking. Default 2.0 — matches HOM-212 ticket. Sub-threshold
    # holds (≤ 2s) are intentional pacing beats per canon; blocking
    # treatment would produce false positives on canonical pacing.
    dead_zone_threshold_s: 2.0
    # Selector-substring allowlist for collision-flag carve-outs (chrome
    # decoratives where helper bbox-overlap on entrance + breathing yoyo
    # is FP-by-construction; HOM-211 reviewer caveat). Each entry is
    # a substring matched against the helper-reported `selector` string;
    # any hit demotes the collision flag from blocking to advisory.
    # Caption canon (`#cg-N`) is matched separately by regex and is
    # always carved out — this list covers the chrome decoratives only.
    collision_decorative_allowlist:
      - "grain"
      - "glow"
      - "hairline"
      - "vignette"
      - "overline"
      - "corner-mark"
      - "footer-mark"
      - "caption-strip"
      - "margin-tick"
    # Minimum bbox dimension (pixels) for a `degenerate` flag to be
    # blocking. Smaller-than-this on either width or height across all
    # bbox samples means the element is a 1-2px decorative (hairline /
    # tick / underline) where degenerate-by-construction is intentional.
    degenerate_min_bbox_px: 2.0
    # HOM-284: trailing dead-zone carve-out. A dead zone whose end is
    # within `dead_zone_tail_tolerance_s` seconds of the composition
    # duration AND whose own length is ≤ `dead_zone_trailing_max_s`
    # seconds is demoted from blocking to advisory — it's an upstream
    # measurement artifact from yoyo+repeat tweens under-reporting
    # total time vs `node.duration()`, not a real pacing hole.
    dead_zone_tail_tolerance_s: 0.5
    # Strict-mode escape hatch: set `dead_zone_trailing_max_s: 0` to
    # disable the trailing carve-out entirely (every trailing dead zone
    # over `dead_zone_threshold_s` flags as blocking, no demotion).
    dead_zone_trailing_max_s: 5.0

concurrency:
  claude: 2
  codex: 2
  gemini: 3

defaults:
  timeout_s: 120

# Tier semantics (HOM-115): cheap=Haiku, smart=Sonnet, expensive=Opus.
# See `graph/src/edit_episode_graph/backends/claude.py` for the mapping and
# memory `feedback_creative_nodes_flagship_tier` for why creative nodes
# (design / expansion / plan / beats / captions) are pinned to `expensive`.
node_overrides:
  p3_pre_scan:
    tier: cheap
    backend_preference: ["claude", "codex"]
    timeout_s: 90
    # Pre-scan is structured analysis over a known transcript shape — Haiku
    # handles it. (Pre-HOM-115 this node was `tier: cheap` + an explicit
    # Haiku model pin to override the old Sonnet→cheap mapping; with the
    # three-tier rename `cheap` IS Haiku, so the pin is no longer needed.)
  p3_strategy:
    tier: expensive
    backend_preference: ["claude"]
    timeout_s: 300
    # Opus 4.7 on full pre_scan context exceeds the global 120s default; aligned
    # with sibling expensive-tier creative nodes (edl_select 600, plan 240,
    # prompt_expansion 600). Discovered in HOM-154 first clean E2E.
    # HOM-157 cfg-fingerprint invalidates cache automatically on bumps.
  p3_edl_select:
    tier: smart
    backend_preference: ["claude"]
    timeout_s: 600
    # EDL is the highest-stakes numeric step (HR 6/7 word-boundary +
    # 30–200ms padding across all cuts); Haiku-4.5 empirically fails the
    # padding window, and Opus 4.7 (`tier: expensive`) timed out at 180s
    # in HOM-107 smoke. Sonnet 4.6 (`tier: smart`) hits the precision/
    # latency sweet spot. (Pre-HOM-115 this was `tier: smart` + an
    # explicit Sonnet model pin to override the old Opus→smart mapping;
    # with the three-tier rename `smart` IS Sonnet, so the pin is no
    # longer needed.)
    # 240→360→600 in HOM-154: two consecutive E2E runs on slug
    # 2026-05-06-who-else-is-tired-of-endless-monthly hit walltime 240.141s
    # then 360.079s — exactly at each prior limit. If 600s also fails,
    # switch to `tier: expensive` (Opus 4.7) or pre-trim transcript inputs.
  p3_self_eval:
    tier: cheap
    backend_preference: ["claude", "codex"]
    timeout_s: 180
    # Self-eval is a structured pass/fail check; cheap (Haiku) is fine.
  p3_persist_session:
    tier: cheap
    backend_preference: ["claude", "codex"]
    timeout_s: 120
    # Mechanical structured-write — cheap (Haiku).
  p4_persist_session:
    tier: cheap
    backend_preference: ["claude", "codex"]
    timeout_s: 120
    # Mechanical structured-write — sole Phase 4 LLM node that legitimately
    # stays cheap (per memory `feedback_creative_nodes_flagship_tier`
    # exception list).
  p4_design_system:
    tier: expensive
    backend_preference: ["claude"]
    timeout_s: 240
    # Visual identity is creative — palette, typography, references,
    # alternatives, anti-patterns. tier=expensive resolves to Opus 4.7.
    # See memory `feedback_creative_nodes_flagship_tier` and HOM-118 for
    # rationale (cheap models hollow out brand-defining creative work).
  p4_prompt_expansion:
    tier: expensive
    backend_preference: ["claude"]
    timeout_s: 600
    # Per canon `references/prompt-expansion.md`: "the quality gap between a
    # single-pass composition and a multi-scene-pipeline composition comes
    # from this step." Highest-leverage creative node in Phase 4. tier=expensive
    # resolves to Opus 4.7. See memory `feedback_creative_nodes_flagship_tier`
    # and HOM-119.
    # 300→600 in HOM-154: first clean E2E hit walltime ~300s exactly at the
    # prior limit. Multi-scene expansion is genuinely long on Opus 4.7.
  p4_plan:
    tier: expensive
    backend_preference: ["claude"]
    timeout_s: 240
    # Plan determines pacing, energy peaks, scene rhythm, per-boundary
    # transition mechanism — creative direction, not mechanical translation.
    # Spec §6.3 originally `cheap`; HOM-120 amended to flagship tier (memory
    # `feedback_creative_nodes_flagship_tier`).
  p4_beat:
    tier: expensive
    backend_preference: ["claude"]
    timeout_s: 600
    # Per-scene Pattern A authoring (HOM-134). Bumped cheap→expensive in
    # HOM-193 — the prior `tier: cheap` pin (intended for fixture-iteration
    # cost savings) silently violated memory `feedback_creative_nodes_flagship_tier`
    # and was the root cause of HOM-154 gate-redispatch loops (Haiku output
    # consistently failed gate:lint / gate:design_adherence, costing more
    # than one successful Opus run). Routing-config fingerprint (HOM-157)
    # auto-invalidates this node's cache on the tier bump.
  p4_redispatch_beat:
    tier: expensive
    backend_preference: ["claude"]
    timeout_s: 600
    # Re-authors one scene fragment after a cluster-gate fail. Same shape as
    # p4_beat (creative scene composition, Read+Write tools), so same budget.
    # Without an explicit override the global defaults clobber the LLMNode's
    # timeout_s=300 down to 120 AND inject codex into backend_preference,
    # which on Windows immediately ENOENT's. Surfaced in HOM-154 first clean
    # E2E (PR #84 added attempts-detail in AllBackendsExhausted message;
    # the fix made the diagnosis trivial).
  gate_animation_map_classify:
    tier: cheap
    backend_preference: ["claude"]
    timeout_s: 120
    # HOM-156 (review S2): cheap-tier fix-or-justify classifier. Pinned to
    # claude-only because codex ENOENTs on Windows under the global default
    # `["claude", "codex"]` (HOM-154 retro on p4_redispatch_beat). The
    # HOM-157 cfg-fingerprint also relies on the per-node entry being
    # node-specific rather than the global default.
  p4_captions_layer:
    tier: expensive
    backend_preference: ["claude"]
    timeout_s: 300
    # Tone-adaptive captions (HOM-123). Bumped cheap→expensive in HOM-193
    # alongside p4_beat. Canon `references/captions.md` §"Style Detection"
    # is explicitly tone-adaptive (4 dimensions × 5 tone profiles, per-word
    # emphasis decisions); cheap-tier output is structurally insufficient.
    # Aligns with memory `feedback_creative_nodes_flagship_tier`. Routing-
    # config fingerprint (HOM-157) auto-invalidates cache on the bump.
